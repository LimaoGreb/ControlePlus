workflows:
  android-apk:
    name: Android APK Release
    max_build_duration: 60
    environment:
      node: 18.19.0
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild (gera pasta android)
        script: npx expo prebuild --platform android --clean --no-install
      - name: Gera keystore para assinar o APK
        script: |
          keytool -genkey -v \
            -keystore /tmp/release.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=FinanceApp,O=Kowalsky,C=BR"
      - name: Build APK release (bundle embutido)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.jks \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password=android123 \
            --no-daemon
    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
