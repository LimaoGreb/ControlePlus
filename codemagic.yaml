workflows:
  android-apk:
    name: Android APK Debug
    max_build_duration: 60
    environment:
      node: 18.19.0
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild (gera pasta android)
        script: npx expo prebuild --platform android --clean --no-install
      - name: Ativa bundle embutido no debug
        script: echo "BUNDLE_IN_DEBUG=true" >> android/gradle.properties
      - name: Build APK debug
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
